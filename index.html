<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rikar.IA</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0f;--sb:#111114;--card:#18181c;--border:#2a2a30;--acc:#7c6af7;--acc2:#c084fc;--text:#f0f0f5;--muted:#7b7b8c;--sw:272px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{display:flex;height:100dvh;background:var(--bg);color:var(--text);font-family:'DM Sans','Segoe UI',sans-serif}
#sb{width:var(--sw);background:var(--sb);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:100}
#sb-head{padding:18px 14px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.logo-txt{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#new-btn{margin:10px;padding:9px 14px;background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;border-radius:10px;color:#fff;font-family:'DM Sans',sans-serif;font-weight:500;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:opacity .2s}
#new-btn:hover{opacity:.88}
#conv-list{flex:1;overflow-y:auto;padding:4px 6px}
#conv-list::-webkit-scrollbar{width:3px}
#conv-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.grp-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:10px 8px 4px}
.ci{padding:8px 10px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:8px;border-left:3px solid transparent;transition:background .15s}
.ci:hover{background:var(--card)}
.ci.active{background:rgba(124,106,247,.15);border-left-color:var(--acc)}
.ci-title{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.ci-del{opacity:0;background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 5px;border-radius:4px;flex-shrink:0;transition:opacity .15s,color .15s}
.ci:hover .ci-del{opacity:1}
.ci-del:hover{color:#f87171}
.empty-sb{text-align:center;color:var(--muted);font-size:12px;padding:20px 12px;line-height:1.6}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{height:54px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;background:rgba(13,13,15,.85);backdrop-filter:blur(12px);flex-shrink:0}
#menu-btn{display:none;background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:4px}
#top-title{flex:1;font-family:'Syne',sans-serif;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tts-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:5px;transition:all .2s;font-family:'DM Sans',sans-serif}
#tts-btn.on{border-color:var(--acc);color:var(--acc)}
#chat{flex:1;overflow-y:auto;padding:20px 0;display:flex;flex-direction:column;gap:4px}
#chat::-webkit-scrollbar{width:3px}
#chat::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.row{display:flex;padding:2px 18px;animation:fadeUp .25s ease}
.row.user{justify-content:flex-end}
.row.ai{justify-content:flex-start}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.av{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;margin-right:8px;margin-top:2px}
.bub{max-width:min(72%,660px);padding:10px 15px;border-radius:17px;font-size:14.5px;line-height:1.65;word-break:break-word}
.user .bub{background:var(--acc);color:#fff;border-bottom-right-radius:4px}
.ai .bub{background:var(--card);border:1px solid var(--border);color:var(--text);border-bottom-left-radius:4px}
.bub p{margin:4px 0}.bub p:first-child{margin-top:0}.bub p:last-child{margin-bottom:0}
.bub strong{font-weight:600}.bub em{font-style:italic}
.bub code{background:rgba(124,106,247,.18);border:1px solid rgba(124,106,247,.3);border-radius:5px;padding:1px 6px;font-family:monospace;font-size:13px}
.bub pre{background:#0a0a0c;border:1px solid var(--border);border-radius:10px;padding:12px;overflow-x:auto;margin:8px 0}
.bub pre code{background:none;border:none;padding:0}
.bub ul,.bub ol{padding-left:20px;margin:6px 0}.bub li{margin:2px 0}
.dots{display:flex;gap:5px;align-items:center;padding:14px 16px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:bounce 1.2s infinite ease-in-out}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-7px);opacity:1}}
#welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;gap:10px}
.big-logo{width:62px;height:62px;border-radius:20px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:6px;box-shadow:0 0 40px rgba(124,106,247,.3)}
#welcome h2{font-family:'Syne',sans-serif;font-weight:800;font-size:26px}
#welcome p{color:var(--muted);font-size:14px;max-width:300px;line-height:1.6}
.sugs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.sug{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.sug:hover{border-color:var(--acc);color:var(--acc)}
#input-area{padding:10px 14px 14px;border-top:1px solid var(--border);flex-shrink:0}
#input-box{background:var(--card);border:1px solid var(--border);border-radius:13px;display:flex;align-items:flex-end;gap:8px;padding:7px 7px 7px 13px;transition:border-color .2s}
#input-box.focus{border-color:var(--acc)}
#inp{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14.5px;line-height:1.5;resize:none;max-height:160px;min-height:22px;padding:3px 0}
#inp::placeholder{color:var(--muted)}
#send{width:35px;height:35px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;transition:opacity .2s}
#send:disabled{background:var(--border);cursor:default}
.hint{text-align:center;font-size:11px;color:var(--muted);margin-top:7px}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90}
@media(max-width:700px){
  #sb{position:fixed;top:0;left:0;bottom:0;transform:translateX(-100%)}
  #sb.open{transform:translateX(0)}
  #overlay.open{display:block}
  #menu-btn{display:block}
  .bub{max-width:88%}
  .row{padding:2px 10px}
  #input-area{padding:8px 10px 12px}
  #welcome h2{font-size:22px}
}
</style>
</head>
<body>
<div id="sb">
  <div id="sb-head">
    <div class="logo">✦</div>
    <span class="logo-txt">Rikar.IA</span>
  </div>
  <button id="new-btn"><span style="font-size:16px">＋</span> Nouvelle conversation</button>
  <div id="conv-list"></div>
</div>
<div id="overlay"></div>
<div id="main">
  <div id="topbar">
    <button id="menu-btn">☰</button>
    <span id="top-title">Rikar.IA</span>
    <button id="tts-btn">🔇 Voix</button>
  </div>
  <div id="chat">
    <div id="welcome">
      <div class="big-logo">✦</div>
      <h2>Rikar.IA</h2>
      <p>Posez n'importe quelle question, je suis là pour vous aider.</p>
      <div class="sugs">
        <button class="sug">💡 Explique-moi une chose</button>
        <button class="sug">✍️ Aide à la rédaction</button>
        <button class="sug">🔢 Résoudre un problème</button>
        <button class="sug">💻 Aide en code</button>
      </div>
    </div>
  </div>
  <div id="input-area">
    <div id="input-box">
      <textarea id="inp" rows="1" placeholder="Écrivez votre message…" maxlength="4000"></textarea>
      <button id="send">➤</button>
    </div>
    <div class="hint">Entrée pour envoyer &nbsp;•&nbsp; Maj+Entrée pour saut de ligne</div>
  </div>
</div>
<script>
let convs=[],currentId=null,ttsOn=false,busy=false;
function load(){try{convs=JSON.parse(localStorage.getItem('rikar_convs')||'[]')}catch{convs=[]}}
function save(){localStorage.setItem('rikar_convs',JSON.stringify(convs))}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function dateGroup(ts){const d=new Date(ts),now=new Date(),diff=now-d;if(diff<86400000)return"Aujourd'hui";if(diff<172800000)return"Hier";if(diff<604800000)return d.toLocaleDateString('fr',{weekday:'long'});return d.toLocaleDateString('fr',{day:'numeric',month:'short'})}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function md(text){let h=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/```([\s\S]*?)```/g,(_,c)=>`<pre><code>${c.trim()}</code></pre>`).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/^#{1,3}\s+(.+)$/gm,'<strong>$1</strong>').replace(/^[\-\*]\s+(.+)$/gm,'<li>$1</li>').replace(/^\d+\.\s+(.+)$/gm,'<li>$1</li>');h=h.split('\n\n').map(p=>{p=p.trim();if(!p)return'';if(/^<(pre|ul|ol|li)/.test(p))return p;return'<p>'+p.replace(/\n/g,'<br>')+'</p>'}).join('');return h}
function renderSidebar(){const list=document.getElementById('conv-list');list.innerHTML='';if(!convs.length){list.innerHTML='<div class="empty-sb">Aucune conversation.<br>Commencez à écrire !</div>';return}const groups={};[...convs].sort((a,b)=>(b.updatedAt||b.createdAt)-(a.updatedAt||a.createdAt)).forEach(c=>{const g=dateGroup(c.updatedAt||c.createdAt);(groups[g]=groups[g]||[]).push(c)});for(const[label,items]of Object.entries(groups)){const lbl=document.createElement('div');lbl.className='grp-lbl';lbl.textContent=label;list.appendChild(lbl);items.forEach(c=>{const item=document.createElement('div');item.className='ci'+(c.id===currentId?' active':'');item.innerHTML=`<span style="font-size:13px">💬</span><span class="ci-title">${esc(c.title||'Nouvelle conversation')}</span><button class="ci-del" title="Supprimer">✕</button>`;item.onclick=()=>loadConv(c.id);item.querySelector('.ci-del').onclick=e=>{e.stopPropagation();delConv(c.id)};list.appendChild(item)})}}
function newConv(){const c={id:genId(),title:'Nouvelle conversation',messages:[],createdAt:Date.now(),updatedAt:Date.now()};convs.unshift(c);save();loadConv(c.id);closeSide()}
function loadConv(id){currentId=id;const c=convs.find(x=>x.id===id);document.getElementById('top-title').textContent=c.title||'Rikar.IA';const chat=document.getElementById('chat');chat.innerHTML='';if(!c.messages.length){chat.appendChild(makeWelcome())}else{c.messages.forEach(m=>chat.appendChild(makeBubble(m.role,m.content)));scroll()}renderSidebar()}
function delConv(id){convs=convs.filter(c=>c.id!==id);save();if(currentId===id){currentId=null;resetChat()}renderSidebar()}
function resetChat(){document.getElementById('chat').innerHTML='';document.getElementById('chat').appendChild(makeWelcome());document.getElementById('top-title').textContent='Rikar.IA'}
function makeWelcome(){const d=document.createElement('div');d.id='welcome';d.innerHTML=`<div class="big-logo">✦</div><h2>Rikar.IA</h2><p>Posez n'importe quelle question, je suis là pour vous aider.</p><div class="sugs"><button class="sug">💡 Explique-moi une chose</button><button class="sug">✍️ Aide à la rédaction</button><button class="sug">🔢 Résoudre un problème</button><button class="sug">💻 Aide en code</button></div>`;d.querySelectorAll('.sug').forEach(b=>b.onclick=()=>{document.getElementById('inp').value=b.textContent.replace(/^\S+\s/,'').trim();document.getElementById('inp').focus()});return d}
function makeBubble(role,content){const row=document.createElement('div');row.className='row '+role;if(role==='ai'){const av=document.createElement('div');av.className='av';av.textContent='✦';row.appendChild(av)}const b=document.createElement('div');b.className='bub';b.innerHTML=role==='ai'?md(content):esc(content).replace(/\n/g,'<br>');row.appendChild(b);return row}
function scroll(){const c=document.getElementById('chat');c.scrollTop=c.scrollHeight}
async function sendMsg(){const inp=document.getElementById('inp');const text=inp.value.trim();if(!text||busy)return;if(!currentId){const c={id:genId(),title:text.slice(0,42)+(text.length>42?'…':''),messages:[],createdAt:Date.now(),updatedAt:Date.now()};convs.unshift(c);currentId=c.id}const c=convs.find(x=>x.id===currentId);const w=document.getElementById('welcome');if(w)w.remove();inp.value='';inp.style.height='auto';c.messages.push({role:'user',content:text});c.updatedAt=Date.now();if(c.title==='Nouvelle conversation'){c.title=text.slice(0,42)+(text.length>42?'…':'');document.getElementById('top-title').textContent=c.title}save();renderSidebar();const chat=document.getElementById('chat');chat.appendChild(makeBubble('user',text));const loaderRow=document.createElement('div');loaderRow.className='row ai';loaderRow.innerHTML='<div class="av">✦</div><div class="bub" style="padding:0"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>';chat.appendChild(loaderRow);scroll();busy=true;document.getElementById('send').disabled=true;const apiMsgs=c.messages.map(m=>({role:m.role==='ai'?'assistant':'user',content:m.content}));try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:apiMsgs})});const data=await res.json();loaderRow.remove();if(data.error)throw new Error(data.error);const reply=data.reply||"Désolé, je n'ai pas pu répondre.";c.messages.push({role:'ai',content:reply});c.updatedAt=Date.now();save();chat.appendChild(makeBubble('ai',reply));scroll();if(ttsOn)speak(reply)}catch(err){loaderRow.remove();c.messages.push({role:'ai',content:"Erreur de connexion. Réessayez."});save();chat.appendChild(makeBubble('ai',"Erreur de connexion. Réessayez."));scroll()}busy=false;document.getElementById('send').disabled=false;inp.focus()}
function speak(text){if(!window.speechSynthesis)return;speechSynthesis.cancel();const plain=text.replace(/<[^>]+>/g,'').replace(/\*\*/g,'').replace(/`/g,'');const u=new SpeechSynthesisUtterance(plain);u.lang='fr-FR';speechSynthesis.speak(u)}
function openSide(){document.getElementById('sb').classList.add('open');document.getElementById('overlay').classList.add('open')}
function closeSide(){document.getElementById('sb').classList.remove('open');document.getElementById('overlay').classList.remove('open')}
document.getElementById('send').onclick=sendMsg;
document.getElementById('new-btn').onclick=newConv;
document.getElementById('menu-btn').onclick=openSide;
document.getElementById('overlay').onclick=closeSide;
document.getElementById('tts-btn').onclick=function(){ttsOn=!ttsOn;this.textContent=(ttsOn?'🔊':'🔇')+' Voix';this.classList.toggle('on',ttsOn)};
const inp=document.getElementById('inp');
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}});
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,160)+'px'});
inp.addEventListener('focus',()=>document.getElementById('input-box').classList.add('focus'));
inp.addEventListener('blur',()=>document.getElementById('input-box').classList.remove('focus'));
load();renderSidebar();
</script>
</body>
</html>
